services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: portfolio-container

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    restart: unless-stopped